<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3fa">
  <title>Pokémon Home Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <h1>Pokémon <span>Home Tracker</span></h1>
    <div class="collection-progress" aria-label="Collection progress" aria-live="polite">
      <div><span>Regular</span><progress id="regular-progress" value="0" max="1"></progress><b id="regular-home-count">0 / 0</b></div>
      <div><span>Shiny</span><progress id="shiny-progress" value="0" max="1"></progress><b id="shiny-home-count">0 / 0</b></div>
    </div>
  </header>

  <main id="app">
    <div id="boxes" class="boxes"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-ball">✓</div><h2>All transferred</h2><p>No caught Pokémon are waiting for Home.</p>
    </div>
  </main>

  <nav class="dock" aria-label="Main navigation">
    <button type="button" data-view="pokedex" class="active"><svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5.5 4.5h9.25a3.75 3.75 0 0 1 3.75 3.75v11.25H9.25a3.75 3.75 0 0 1-3.75-3.75V4.5Z"></path><path d="M9 8h6"></path><path d="M9 11.5h5"></path><path d="M9 15h3"></path></svg>Pokédex</button>
    <button type="button" data-view="transfer"><svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v12"></path><path d="m7.5 8.5 4.5-4.5 4.5 4.5"></path><path d="M5 15.5v2.25A2.25 2.25 0 0 0 7.25 20h9.5A2.25 2.25 0 0 0 19 17.75V15.5"></path></svg>Home Transfer <b id="transfer-count">0</b></button>
  </nav>
  <script src="data/pokemon.js"></script>
  <script src="app.js"></script>
</body>
</html>
