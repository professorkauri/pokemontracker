<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf3fa">
  <title>Pokémon Home Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <h1>Pokémon <span>Home Tracker</span></h1>
    <div class="collection-progress" aria-label="Collection progress" aria-live="polite">
      <div><span>Regular</span><progress id="regular-progress" value="0" max="1"></progress><b id="regular-home-count">0 / 0</b></div>
      <div><span>Shiny</span><progress id="shiny-progress" value="0" max="1"></progress><b id="shiny-home-count">0 / 0</b></div>
    </div>
  </header>

  <main id="app">
    <div id="boxes" class="boxes"></div>
    <div id="empty" class="empty" hidden>
      <div class="empty-ball">✓</div><h2>All transferred</h2><p>No caught Pokémon are waiting for Home.</p>
    </div>
  </main>

  <nav class="dock" aria-label="Main navigation">
    <button type="button" data-view="pokedex" class="active"><span>▦</span>Pokédex</button>
    <button type="button" data-view="transfer"><span>⇧</span>Home Transfer <b id="transfer-count">0</b></button>
  </nav>
  <script src="data/pokemon.js"></script>
  <script src="app.js"></script>
</body>
</html>
